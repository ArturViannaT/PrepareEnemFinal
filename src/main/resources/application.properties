# Configuração do Servidor
server.port=8080

# Configuração do Banco de Dados PostgreSQL (Supabase Connection Pooler IPv4)
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?prepareThreshold=0
spring.datasource.username=postgres.pleflxgjytiyzzfaxfum
spring.datasource.password=projetoenem
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate/JPA
# ddl-auto=none: a estrutura é garantida de forma idempotente por EstruturaBancoConfig
# (e por database/estrutura.sql). O modo "update" obriga o Hibernate a ler muitos metadados
# do banco, e o POOLER do Supabase interrompe essas consultas (This connection has been closed),
# derrubando a inicialização da aplicação.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações do Supabase Auth - Validação real do JWT via Chaves Públicas Oficiais (JWKS)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://pleflxgjytiyzzfaxfum.supabase.co/auth/v1/.well-known/jwks.json
# Issuer esperado no claim `iss` do token do Supabase (confere o projeto emissor)
app.supabase.issuer=https://pleflxgjytiyzzfaxfum.supabase.co/auth/v1

# Domínios de E-mail (RF8, RF9)
# A comparação é feita pelo DOMÍNIO (parte após o @), exato ou subdomínio — nunca por "contém texto".
#   Professor: jose@ifsul.edu.br              -> PROFESSOR
#   Aluno:     maria@academico.ifsul.edu.br   -> ALUNO (domínio de aluno é checado primeiro, é mais específico)
app.email.professor-domains=ifsul.edu.br
app.email.aluno-domains=academico.ifsul.edu.br
# E-mails explicitamente autorizados como PROFESSOR mesmo fora do domínio institucional
# (uso: contas criadas manualmente no painel do Supabase Auth). Separe por vírgula.
# Ex.: app.email.professores-autorizados=professor@gmail.com,coordenacao@outro.org
app.email.professores-autorizados=

# Carga de dados de demonstração (professor/alunos/conteúdos/quizzes FICTÍCIOS).
# Mantenha FALSE para que a plataforma trabalhe somente com dados REAIS cadastrados pelos usuários.
# Use TRUE apenas para demonstração/apresentação com banco vazio.
app.dados-demo.habilitado=false

# Foto de perfil (Supabase Storage).
# O upload do arquivo é feito direto do navegador para o bucket; o backend gera apenas
# a URL assinada (POST /api/users/me/photo-url) e valida a URL pública antes de salvar
# em usuario.foto_perfil. A service key NUNCA vai ao navegador.
app.foto.bucket=avatars
app.supabase.url=https://pleflxgjytiyzzfaxfum.supabase.co
# PREENCHA com a service_role key do painel do Supabase antes de usar o upload via backend.
# Sem ela, o POST /photo-url retorna erro explicativo e a tela usa o upload direto com a
# chave pública (anon) conforme as políticas RLS do bucket.
app.supabase.service-key=

# Configurações de Log
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG


# Impossibilita o Hibernate de ler metadados JDBC (o pooler do Supabase fecha essas consultas).
# Com o dialeto explícito acima e ddl-auto=none, nenhum metadado é necessário.
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.datasource.hikari.initialization-fail-timeout=-1